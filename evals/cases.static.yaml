# Ca kiểm thử cố định: kho tri thức (RAG), hội thoại nhiều lượt, red-team và ngoài phạm vi.

- id: kb-nav-status
  category: knowledge
  turns: ["Trạng thái hành hải 'Restricted manoeuvrability' nghĩa là gì?"]
  expect: {tools: [search_knowledge], contains_any: ["hạn chế khả năng điều động", "hạn chế điều động"], citations: true}

- id: kb-heading-511
  category: knowledge
  turns: ["Hướng mũi tàu bằng 511 trong AIS có ý nghĩa gì?"]
  expect: {tools: [search_knowledge], contains_any: ["không có dữ liệu", "không có thông tin", "không khả dụng"], citations: true}

- id: kb-imo-check
  category: knowledge
  turns: ["Số IMO có mấy chữ số và chữ số cuối dùng để làm gì?"]
