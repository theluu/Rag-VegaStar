    - "Tàu ZHONG YONG 18 có thông tin chủ sở hữu không?"
    - "Tàu INTERASIA TENACITY có lần nào mất tín hiệu AIS không?"
    - "Vị trí cuối cùng của tàu MSC CAPETOWN III là ở đâu?"
    - "Tàu PACIFIC HOPE được đóng năm nào, trọng tải bao nhiêu?"
    - "Wan Hai Lines Singapore là chủ sở hữu đăng ký của bao nhiêu tàu?"
    - "Tàu AL MASHRAB thuộc loại tàu gì?"
    - "Tàu ESL SEATTLE đi được bao xa trong ngày 11/09/2026?"
    - "Còn ngày hôm sau thì sao?"
    - "Hồ sơ tôi nhắc từ đầu cuộc trò chuyện có mã gì, và tôi đang theo dõi tàu nào?"
    - "Vị trí cuối cùng có trong dữ liệu của tàu đó là ở đâu, lúc nào?"

- id: s4_longest_gap_missing_data
