services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      # Trong mạng compose, API nói chuyện với DB qua tên service `db`
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATA_DIR: /app/data
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./data:/app/data:ro
      - ./results:/app/results
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:5173}
        VITE_API_KEY: ${VITE_API_KEY:-}
        VITE_LOGIN_HINT: ${VITE_LOGIN_HINT:-}
    environment:
      # Nguồn được phép trong Content-Security-Policy của trang
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8000}
      MAP_ORIGIN: ${MAP_ORIGIN:-https://tiles.openfreemap.org}
    ports:
      - "${WEB_HOST_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
