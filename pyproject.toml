[project]
name = "vessel-chat"
version = "0.1.0"
description = "LLM chatbot for vessel AIS lookup with streaming API and long-term memory"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "numpy>=1.26",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sse-starlette>=2.1",
    "openai>=1.50",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "asgi-lifespan>=2.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vessel_chat = ["schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["tests"]
