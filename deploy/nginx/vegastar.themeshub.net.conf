# vegastar.themeshub.net — giao diện tĩnh + API FastAPI (systemd: vegastar-api)
upstream vegastar_api { server 127.0.0.1:8011; keepalive 16; }

map $sent_http_content_type $vegastar_cache {
    default            "no-cache";
    ~^text/html        "no-cache";
    ~^text/plain       "public, max-age=3600";
    ~^application/xml  "public, max-age=3600";
}

server {
    listen 80;
    listen [::]:80;
    server_name vegastar.themeshub.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vegastar-acme;
        default_type "text/plain";
        allow all;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vegastar.themeshub.net;

    ssl_certificate     /etc/letsencrypt/live/vegastar.themeshub.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vegastar.themeshub.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/vegastar.access.log;
    error_log  /var/log/nginx/vegastar.error.log;

    root /var/www/vegastar;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tiles.openfreemap.org https://server.arcgisonline.com; connect-src 'self' https://tiles.openfreemap.org https://server.arcgisonline.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cache-Control $vegastar_cache always;

    # ---- API (FastAPI) ----
    # Metrics Prometheus lộ lưu lượng và chi phí → chỉ xem được từ trong máy chủ
    location = /api/metrics { deny all; }

    location ^~ /api/ {
        proxy_pass http://vegastar_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Chat trả lời theo luồng SSE: không đệm, không timeout sớm
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering "no" always;
    }

    # Số liệu vận hành và tài liệu API: chỉ dùng nội bộ, không mở ra Internet
    location = /metrics { deny all; }
    location /docs      { deny all; }
    location /redoc     { deny all; }

    location = /llms.txt      { default_type "text/plain; charset=utf-8"; }
    location = /llms-full.txt { default_type "text/plain; charset=utf-8"; }
    location = /robots.txt    { default_type "text/plain; charset=utf-8"; }
    location = /manifest.webmanifest { default_type "application/manifest+json"; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # /pitch/ là trang tĩnh riêng → phải thử thư mục trước khi rơi về ứng dụng React
    location / { try_files $uri $uri/ /index.html; }
}
